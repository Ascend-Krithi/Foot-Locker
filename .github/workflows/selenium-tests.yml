on:
  push:
    branches: [ "main", "Feature-*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ✅ NO pom.xml overwrite step — agent-committed pom.xml is authoritative

      - name: Validate POM
        run: mvn -q -B validate

      - name: Install Chrome (compatible version)
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 124

      - name: Show Chrome version
        run: |
          echo "Chrome path: ${{ steps.chrome.outputs.chrome-path }}"
          ${{ steps.chrome.outputs.chrome-path }} --version

      - name: Remove preinstalled chromedriver (avoid mismatch)
        run: |
          if command -v chromedriver; then
            sudo rm -f "$(command -v chromedriver)"
          fi

      - name: Install Xvfb & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg

      - name: Start Xvfb
        env:
          DISPLAY: ":99"
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac >/dev/null 2>&1 &
          sleep 2

      - name: Start screen recording (playable MP4)
        env:
          DISPLAY: ":99"
        run: |
          mkdir -p recordings
          ffmpeg -y \
            -f x11grab -framerate 30 -video_size 1920x1080 -i ${DISPLAY} \
            -c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 23 \
            -movflags +faststart \
            recordings/test-run.mp4 >/dev/null 2>&1 &
          echo $! > ffmpeg.pid

      # ✅ NO -Dtest filter — runs ALL tests defined in testng.xml
      - name: Run All Tests (headed on Xvfb :99)
        env:
          DISPLAY: ":99"
          HEADLESS: "false"
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          unset CHROMEWEBDRIVER || true
          mvn -X -B -fae \
            -Dheadless=false \
            -Dwebdriver.http.factory=jdk-http-client \
            -DchromeBinary="${{ steps.chrome.outputs.chrome-path }}" \
            test

      - name: Stop screen recording
        if: always()
        run: |
          if [ -f ffmpeg.pid ]; then
            kill -INT "$(cat ffmpeg.pid)" || true
            sleep 2
          fi
          ls -lh recordings || true

          if [ -s recordings/test-run.mp4 ]; then
            ffmpeg -y -i recordings/test-run.mp4 -c copy -movflags +faststart recordings/test-run_faststart.mp4 >/dev/null 2>&1 || true
            if [ -s recordings/test-run_faststart.mp4 ]; then
              mv -f recordings/test-run_faststart.mp4 recordings/test-run.mp4
            fi
          fi

      - name: Upload Artifacts (Video + Reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-artifacts
          path: |
            recordings/test-run.mp4
            **/target/surefire-reports/**
            **/test-output/**
            **/ExtentReport.html
          if-no-files-found: warn
